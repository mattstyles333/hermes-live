org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.incremental=true
# Configuration cache (test-shape plan): AGP, Kotlin and these scripts allow it. Entries are
# encrypted by Gradle; the release signing values read from FOLIO_* are part of an entry for an
# assembleRelease run, as they are of its task inputs.
org.gradle.configuration-cache=true
